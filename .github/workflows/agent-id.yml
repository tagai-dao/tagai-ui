name: Agent ID subdomain checks
on:
  pull_request:
    paths:
      - 'apps/agent-id/**'
      - '.github/workflows/agent-id.yml'
  push:
    branches: [main]
    paths:
      - 'apps/agent-id/**'
      - '.github/workflows/agent-id.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent-id
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/agent-id/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run check:data
      - run: npm run build
