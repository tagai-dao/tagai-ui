<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Returning to TagAI…</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fff; color: #191C32; }
    a.btn { padding: 12px 32px; border-radius: 9999px; background: linear-gradient(135deg, #FE913F 0%, #E58339 100%);
            color: #fff; text-decoration: none; font-weight: 600; }
    p { color: #646464; font-size: 14px; padding: 0 24px; text-align: center; }
  </style>
</head>
<body>
  <p id="tip">Returning to the TagAI app…</p>
  <a id="open" class="btn" href="tagai://auth-callback">Open TagAI</a>
  <script>
    // Privy OAuth 的 http(s) 回跳落到本页；把 query/hash 原样转发到 App 的自定义 scheme。
    // 只转发参数，不解析、不存储；App 内 native.ts 会做 scheme/host 严格校验。
    (function () {
      var target = 'tagai://auth-callback' + window.location.search + window.location.hash;
      document.getElementById('open').setAttribute('href', target);
      // 自动唤起；部分浏览器要求用户手势，故保留按钮兜底
      window.location.replace(target);
    })();
  </script>
</body>
</html>
