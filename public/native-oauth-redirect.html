<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Returning to TagAI…</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fff; color: #191C32; }
    a.btn { padding: 12px 32px; border-radius: 9999px; background: linear-gradient(135deg, #FE913F 0%, #E58339 100%);
            color: #fff; text-decoration: none; font-weight: 600; }
    p { color: #646464; font-size: 14px; padding: 0 24px; text-align: center; }
  </style>
</head>
<body>
  <p id="tip">Returning to the TagAI app…</p>
  <a id="open" class="btn" hidden>Open TagAI</a>
  <script>
    // Verified HTTPS App Links normally return directly to Android. This page
    // is a user-gesture fallback for devices with "Open supported links" off.
    // No SDK, analytics, persistence or web login: PKCE belongs to the app.
    (function () {
      var params = new URLSearchParams(window.location.search);
      var keys = ['privy_oauth_code', 'privy_oauth_state', 'privy_oauth_provider'];
      if (keys.some(function (key) { return params.getAll(key).length > 1; }) ||
          !params.get('privy_oauth_state') || params.get('privy_oauth_provider') !== 'twitter' ||
          !params.get('privy_oauth_code')) {
        document.getElementById('tip').textContent = 'Please return to TagAI and start Twitter login again.';
        return;
      }
      var safe = new URLSearchParams();
      keys.forEach(function (key) { if (params.get(key)) safe.set(key, params.get(key)); });
      var target = 'tagai://auth-callback?' + safe;
      var open = document.getElementById('open');
      open.hidden = false;
      // Package-bound intent avoids another app claiming the legacy scheme.
      open.href = /Android/i.test(navigator.userAgent)
        ? 'intent://auth-callback?' + safe + '#Intent;scheme=tagai;package=fun.tagai.app;end'
        : target;
      document.getElementById('tip').textContent = 'Tap Open TagAI to finish login in the app. Do not log in again on this web page.';
    })();
  </script>
</body>
</html>
